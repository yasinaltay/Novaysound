name: APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "Sabit imza anahtarı kullanılıyor"
          else
            echo "::warning::KEYSTORE_BASE64 secret yok, geçici debug anahtarı kullanılıyor (güncellemeler üstüne kurulamaz)"
          fi
      - run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Sürüm adını oku ve APK'yı adlandır
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/*.apk "NovaySound-v$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NovaySound-apk
          path: NovaySound-v*.apk

      # Aynı sürüm numarasıyla tekrar derlenirse release'teki APK güncellenir
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Novay Sound v${{ steps.ver.outputs.version }}
          files: NovaySound-v${{ steps.ver.outputs.version }}.apk
          make_latest: true
